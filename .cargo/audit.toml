[advisories]
ignore = [
    "RUSTSEC-2020-0168", # mach is unmaintained, still required by serialport-rs: https://github.com/serialport/serialport-rs/issues/112
    # crypto-bigint 0.5 timing variability, pulled by age 0.12 -> hpke 0.12 -> p256 0.13. No fixed
    # version is reachable until age updates hpke. The P-256 code only serves age's tag/tagpq
    # recipients; LWK only uses x25519 recipients and identities, so it never runs.
    "RUSTSEC-2026-0387",
]
