on:
  push:
    branches:
      - master
    tags:
      - 'bindings_*'
  pull_request: {}

name: Build & Publish framework for Kotlin library

jobs:

  build:
    runs-on: macos-26
    steps:
      - name: "Show default version of NDK"
        run: echo $ANDROID_NDK_ROOT

      - name: "Check out PR branch"
        uses: actions/checkout@v6

      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-linux-android, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios, aarch64-apple-darwin, x86_64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu, aarch64-pc-windows-msvc, x86_64-pc-windows-msvc
          # cargo-xwin uses the llvm-ar of the Rust toolchain as llvm-lib for the Windows libs
          components: llvm-tools-preview

      - run: brew install just zig

      - name: "Install NDK"
        run: |
          cargo install cargo-ndk --version 3.5.4

      - name: "Build Kotlin Multiplatform bindings"
        run: |
          just kotlin-multiplatform

      - name: "Test JVM library"
        working-directory: lwk_bindings/android_bindings
        run: |
          ./gradlew :lib:jvmTest --console=plain

      - name: "Build Android library"
        working-directory: lwk_bindings/android_bindings
        run: |
          ./gradlew assemble --console=plain

      - name: Temporarily save artifact
        uses: actions/upload-artifact@v7
        with:
          name: lwk-artifact
          path: lwk_bindings/android_bindings
          retention-days: 1
