on:
  push:
    branches:
      - master
  pull_request: {}

name: Build python wheels on mac and windows

# lwk_bindings uses UniFFI 0.29.4, but PyPI did not publish uniffi-bindgen
# 0.29.4. Use the compatible 0.29.5 generator when maturin builds the wheels.
jobs:


  linux-wheels:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: docker://ghcr.io/pyo3/maturin:latest
        with:
          entrypoint: bash
          args: -c "python3 -m pip install uniffi-bindgen==0.29.5 && maturin build --compatibility manylinux2014 --release -m lwk_bindings/Cargo.toml -b uniffi"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-wheels
          path: target/wheels


  osx-wheels:
    strategy:
      matrix:
        os: ["macos-15"]
    runs-on: ${{ matrix.os }}
    steps:
     - uses: actions/checkout@v6
     - uses: dtolnay/rust-toolchain@1.91.0
       with:
         components: "clippy,rust-src,rustfmt" # required by maturin build
     - uses: actions/setup-python@v6
       with:
         python-version: "3.12"
     - run: python3 -m pip install maturin
     - run: python3 -m pip install uniffi-bindgen==0.29.5
     - run: maturin build --release -m lwk_bindings/Cargo.toml -b uniffi
     - uses: actions/upload-artifact@v7
       with:
         name: osx-wheel-${{ matrix.os }}
         path: target/wheels

  windows-wheels:
    runs-on: windows-latest
    steps:
     - uses: actions/checkout@v6
     - uses: dtolnay/rust-toolchain@1.91.0
       with:
         components: "clippy,rust-src,rustfmt" # required by maturin build
     - uses: actions/setup-python@v6
       with:
         python-version: "3.12"
     - run: python3 -m pip install maturin
     - run: python3 -m pip install uniffi-bindgen==0.29.5
     - run: maturin build --release -m lwk_bindings/Cargo.toml -b uniffi
     - uses: actions/upload-artifact@v7
       with:
         name: windows-wheels
         path: target/wheels
