[package]
name = "lwk_anyswap"
version = "0.19.0"
edition = "2021"
description = "Liquid Wallet Kit - anyswap integration"
license = "MIT OR BSD-2-Clause"
documentation = "https://docs.rs/lwk_anyswap"

[lib]
test = false

[dependencies]

[dev-dependencies]
lwk_test_util = "0.19.0"
clightningrpc = "0.3.0-beta.8"
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "blocking",
    "gzip",
    "json",
    "rustls-tls",
] }
