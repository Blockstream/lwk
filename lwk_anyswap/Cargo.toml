[package]
name = "lwk_anyswap"
version = "0.19.0"
edition = "2021"
description = "Liquid Wallet Kit - anyswap integration"
license = "MIT OR BSD-2-Clause"
documentation = "https://docs.rs/lwk_anyswap"

[lib]
test = false

[dependencies]
anyswap-sdk = { version = "1.2.0-rc.2", default-features = false, features = ["client"] }

[dev-dependencies]
lwk_test_util = "0.19.0"
clightningrpc = "0.3.0-beta.8"
tokio = { version = "1", features = ["rt", "macros"] }
