[package]
name = "lwk_prices"
version = "0.19.0"
edition = "2021"
description = "Liquid Wallet Kit - BTC exchange rates against fiat currencies"
license = "MIT OR BSD-2-Clause"
# TODO: uncomment once lwk_prices is published
# documentation = "https://docs.rs/lwk_prices"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

futures = "0.3"

reqwest.workspace = true
web-time = "1.1.0"

[dev-dependencies]
tokio = { version = "1.36.0", default-features = false, features = [
    "rt",
    "macros",
] }
