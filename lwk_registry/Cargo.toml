[package]
name = "lwk_registry"
version = "0.19.0"
edition = "2021"
description = "Liquid Wallet Kit - asset registry integration"
license = "MIT OR BSD-2-Clause"
documentation = "https://docs.rs/lwk_registry"

[lib]
test = false

[dependencies]

lwk_common = { version = "0.19.0"}

elements.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "blocking",
    "gzip",
    "json",
    "rustls-tls",
] }

idna = "1"
regex-lite = "0.1.5"
once_cell = "1.18.0"

futures = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.36.0", default-features = false, features = [
    "time",
    "rt",
    "macros",
    "rt-multi-thread",
    "sync",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.36.0", default-features = false, features = [
    "time",
    "rt",
    "macros",
] }


[dev-dependencies]
lwk_test_util = { version = "0.19.0" }

[features]
client = ["dep:reqwest", "dep:futures"]
